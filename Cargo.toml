[package]
name = "bitcoin-pages"
version = "0.10.2"
edition = "2021"
repository = "https://github.com/bitcoincore-dev/bitcoin-pages"
license = "MIT"
description = "DAG-based optimistic consensus for Nostr"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nostr = { version = "0.44", default-features = false, features = ["std"] }
nostr-relay-pool = { version = "0.44.3", optional = true }
rand = "0.8"
serde = { version = "1", features = ["derive"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
thiserror = "1.0"
tokio = { version = "1", features = ["full"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
urlencoding = { version = "2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
nostr-relay-builder = "0.44.0"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "federation"
path = "src/bin/federation.rs"
required-features = ["native"]

[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"
required-features = ["native"]

[[bin]]
name = "relay"
path = "src/bin/relay.rs"
required-features = ["relay"]

[[bin]]
name = "bitcoin-pages-server"
path = "src/bin/bitcoin-pages-server.rs"
required-features = ["native"]

[features]
default = []
native = ["dep:tokio", "dep:tracing-subscriber", "dep:nostr-relay-pool", "dep:serde", "dep:serde_json", "dep:reqwest", "dep:urlencoding"]
relay = ["native", "dep:nostr-relay-builder"]
wasm = ["dep:wasm-bindgen", "dep:getrandom", "dep:serde-wasm-bindgen", "dep:serde_json"]

[dependencies.nostr-relay-builder]
version = "0.44.0"
optional = true
